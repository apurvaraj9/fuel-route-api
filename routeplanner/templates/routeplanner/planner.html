<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Route Planner</title>
  <meta name="description" content="Plan a US truck route with the cheapest fuel stops (500-mile range, 10 MPG).">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #18202a; --muted: #5d6875; --line: #e2e6eb;
      --accent: #0b63ce; --accent-text: #ffffff; --good: #1a7f37; --bad: #c62828; --chip: #eef3fb;
      --alt: #8a96a3; --shadow: 0 1px 3px rgba(16, 24, 40, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419; --panel: #171d24; --text: #e6eaef; --muted: #9aa5b1; --line: #2a333d;
        --accent: #4c9aff; --accent-text: #0b1220; --good: #4cc26a; --bad: #ff6b6b; --chip: #1f2a37;
        --alt: #6b7785; --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .app { display: grid; grid-template-columns: 420px 1fr; height: 100%; }
    aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 20px 20px 32px; }
    #map { height: 100%; min-height: 320px; }
    h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -.01em; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    form { display: grid; gap: 10px; }
    label { font-weight: 600; font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .range-value { float: right; color: var(--text); font-weight: 600; }
    input[type=range] { padding: 0; accent-color: var(--accent); }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
    .chip { background: var(--chip); color: var(--text); padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; }
    .status { margin-top: 14px; color: var(--muted); }
    .error { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 6px; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
    .card .k { color: var(--muted); font-size: 12px; }
    .card .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card.big { grid-column: span 2; }
    .card.big .v { font-size: 26px; }
    .note { color: var(--muted); margin: 6px 0 0; }
    h2 { font-size: 14px; margin: 20px 0 8px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; }
    td.num, th.num { text-align: right; }
    .muted { color: var(--muted); font-size: 12px; }
    .alt { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
    .alt.chosen { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .badge { font-size: 11px; font-weight: 700; color: var(--accent); }
    details { margin-top: 16px; }
    summary { cursor: pointer; font-weight: 600; }
    details ul { padding-left: 18px; color: var(--muted); }
    .links { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; }
    a { color: var(--accent); }
    .stop-icon { background: var(--accent); color: #fff; border: 2px solid #fff; border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; font: 700 12px system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
      #map { height: 60vh; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Fuel Route Planner</h1>
    <p class="sub">Cheapest fuel stops for a US trip · 500-mile range · 10 MPG</p>
    <form id="plan-form" autocomplete="off">
      <div><label for="start">Start</label><input id="start" name="start" placeholder="New York, NY" required maxlength="200"></div>
      <div><label for="finish">Finish</label><input id="finish" name="finish" placeholder="Los Angeles, CA" required maxlength="200"></div>
      <div class="chips" aria-label="Examples">
        <button type="button" class="chip" data-start="New York, NY" data-finish="Los Angeles, CA">New York → Los Angeles</button>
        <button type="button" class="chip" data-start="Chicago, IL" data-finish="Dallas, TX">Chicago → Dallas</button>
        <button type="button" class="chip" data-start="Seattle, WA" data-finish="Miami, FL">Seattle → Miami</button>
      </div>
      <div>
        <label for="start_fuel_percent">Tank at start <span class="range-value" id="fuel-value">100%</span></label>
        <input id="start_fuel_percent" name="start_fuel_percent" type="range" min="10" max="100" step="5" value="100">
      </div>
      <div class="row">
        <div><label for="reserve_miles">Reserve (miles)</label><input id="reserve_miles" name="reserve_miles" type="number" min="0" max="200" step="10" value="0"></div>
        <div><label for="route_preference">Route</label>
          <select id="route_preference" name="route_preference">
            <option value="cheapest">Cheapest fuel</option>
            <option value="fastest">Fastest</option>
          </select></div>
      </div>
      <button id="submit" type="submit">Plan route</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="results"></div>
    <div class="links">
      <a href="{% url 'swagger-ui' %}">API docs</a>
      <a href="{% url 'api-index' %}">API index</a>
      <a href="https://github.com/apurvaraj9/fuel-route-api">Source on GitHub</a>
    </div>
  </aside>
  <div id="map" aria-label="Route map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(() => {
  const API = "{% url 'route' %}";
  const $ = (id) => document.getElementById(id);
  const form = $("plan-form"), results = $("results"), statusBox = $("status");
  const money = (v) => "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (v, d = 1) => Number(v).toLocaleString("en-US", { maximumFractionDigits: d });

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v; else node.setAttribute(k, v);
    }
    for (const child of children) node.append(child instanceof Node ? child : document.createTextNode(String(child ?? "")));
    return node;
  }

  // ---- map
  const map = L.map("map", { zoomControl: true }).setView([39.5, -98.35], 4);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Routes: OSRM'
  }).addTo(map);
  let layer = null;
  const dot = (color) => ({ radius: 9, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 });

  function popupFor(p) {
    const box = el("div");
    if (p.kind === "fuel_stop") {
      box.append(el("strong", {}, `Stop ${p.stop_number}: ${p.name}`), el("br"),
        `${p.city}, ${p.state} · route mile ${num(p.route_mile)}`, el("br"),
        `$${p.price_per_gallon}/gal · ${num(p.gallons_purchased)} gal · ${money(p.cost_usd)}`, el("br"),
        el("span", { class: "muted" }, p.placement === "highway" ? "On the route's highway" : "City-centre location"));
    } else {
      box.append(el("strong", {}, p.kind === "start" ? "Start" : "Finish"), el("br"), p.label);
    }
    return box;
  }

  function drawMap(geojson) {
    if (layer) layer.remove();
    const features = geojson.features.slice().sort((a, b) => (a.properties.kind === "alternative_route" ? -1 : 1));
    layer = L.geoJSON({ type: "FeatureCollection", features }, {
      style: (f) => {
        const kind = f.properties.kind;
        if (kind === "alternative_route") return { color: "#8a96a3", weight: 4, opacity: .7, dashArray: "6 8" };
        if (kind === "route") return { color: "#0b63ce", weight: 5, opacity: .9 };
        return dot(kind === "start" ? "#1a7f37" : "#c62828");  // start/finish circles keep their own look
      },
      pointToLayer: (f, latlng) => {
        const p = f.properties;
        if (p.kind === "fuel_stop") {
          return L.marker(latlng, { icon: L.divIcon({ className: "", html: `<div class="stop-icon">${Number(p.stop_number)}</div>`, iconSize: [24, 24] }) });
        }
        return L.circleMarker(latlng, dot(p.kind === "start" ? "#1a7f37" : "#c62828"));
      },
      onEachFeature: (f, lyr) => {
        const p = f.properties;
        if (p.kind === "alternative_route") {
          lyr.bindTooltip(p.feasible ? `Alternative route · ${num(p.distance_miles)} mi · ${money(p.total_fuel_cost_usd)}` : "Alternative route (no feasible fuel plan)");
        } else if (p.kind !== "route") {
          lyr.bindPopup(popupFor(p));
        }
      }
    }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [30, 30] });
  }

  // ---- results panel
  function card(k, v, big = false) {
    return el("div", { class: "card" + (big ? " big" : "") }, el("div", { class: "k" }, k), el("div", { class: "v" }, v));
  }

  function render(data) {
    const plan = data.fuel_plan, route = data.route;
    results.replaceChildren();
    results.append(el("div", { class: "cards" },
      card("Total fuel cost (fuel burned)", money(plan.total_fuel_cost_usd), true),
      card("Distance", `${num(route.distance_miles)} mi`),
      card("Driving time", `${num(route.duration_hours)} h`),
      card("Fuel stops", plan.number_of_stops),
      card("Paid at stops", money(plan.purchases_usd))));
    results.append(el("p", { class: "note" }, plan.note));
    results.append(el("p", { class: "muted" },
      `Starting fuel ${num(plan.starting_fuel.gallons)} gal valued at $${plan.starting_fuel.price_per_gallon}/gal (${plan.starting_fuel.price_source}). ` +
      `Left at destination: ${num(plan.fuel_left_at_destination.gallons)} gal.`));

    if (data.alternatives.length > 1) {
      results.append(el("h2", {}, "Route options"));
      for (const a of data.alternatives) {
        const right = a.feasible ? `${money(a.total_fuel_cost_usd)} · ${a.number_of_stops} stop(s)` : "no feasible plan";
        results.append(el("div", { class: "alt" + (a.chosen ? " chosen" : "") },
          el("div", {}, a.chosen ? el("span", { class: "badge" }, "CHOSEN ") : "", `${num(a.distance_miles)} mi · ${num(a.duration_hours)} h`,
            el("div", { class: "muted" }, (a.main_highways || []).slice(0, 4).join(", "))),
          el("div", {}, right)));
      }
    }

    if (plan.stops.length) {
      results.append(el("h2", {}, "Fuel stops"));
      const table = el("table", {}, el("thead", {}, el("tr", {},
        el("th", {}, "#"), el("th", {}, "Station"), el("th", { class: "num" }, "$/gal"), el("th", { class: "num" }, "Gal"), el("th", { class: "num" }, "Cost"))));
      const body = el("tbody");
      for (const s of plan.stops) {
        body.append(el("tr", {},
          el("td", {}, s.stop_number),
          el("td", {}, s.name, el("div", { class: "muted" }, `${s.city}, ${s.state} · mile ${num(s.route_mile)} · ${s.fill === "full" ? "fill up" : "top up"}`)),
          el("td", { class: "num" }, Number(s.price_per_gallon).toFixed(3)),
          el("td", { class: "num" }, num(s.gallons_purchased)),
          el("td", { class: "num" }, money(s.cost_usd))));
      }
      table.append(body);
      results.append(table);
    }

    const details = el("details", {}, el("summary", {}, "How this was calculated"));
    const list = el("ul");
    for (const a of data.meta.assumptions) list.append(el("li", {}, a));
    list.append(el("li", {}, `${data.meta.external_api_calls} external API call(s); ${data.meta.routes_compared} route option(s) compared; ${data.meta.elapsed_ms} ms.`));
    details.append(list);
    results.append(details);
    drawMap(data.map.geojson);
  }

  // ---- form handling
  const fuel = $("start_fuel_percent");
  fuel.addEventListener("input", () => { $("fuel-value").textContent = fuel.value + "%"; });

  function currentParams() {
    const params = new URLSearchParams();
    params.set("start", $("start").value.trim());
    params.set("finish", $("finish").value.trim());
    if (fuel.value !== "100") params.set("start_fuel_percent", fuel.value);
    if (Number($("reserve_miles").value) > 0) params.set("reserve_miles", $("reserve_miles").value);
    if ($("route_preference").value !== "cheapest") params.set("route_preference", $("route_preference").value);
    return params;
  }

  async function plan() {
    const params = currentParams();
    history.replaceState(null, "", "?" + params.toString());
    $("submit").disabled = true;
    results.replaceChildren();
    statusBox.textContent = "Planning… (on the free server, the first request after a quiet period can take up to a minute)";
    try {
      const response = await fetch(API + "?" + params.toString(), { headers: { Accept: "application/json" } });
      const data = await response.json().catch(() => null);
      statusBox.textContent = "";
      if (!response.ok || !data) {
        const message = data && data.error ? data.error.message : `Request failed (HTTP ${response.status}).`;
        results.append(el("div", { class: "error" }, message));
        return;
      }
      render(data);
    } catch (err) {
      statusBox.textContent = "";
      results.append(el("div", { class: "error" }, "Could not reach the server. Please try again."));
    } finally {
      $("submit").disabled = false;
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); plan(); });
  document.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", () => {
    $("start").value = chip.dataset.start; $("finish").value = chip.dataset.finish; plan();
  }));

  // Pre-fill from the URL (the API's map.url links here) and plan straight away.
  const initial = new URLSearchParams(location.search);
  if (initial.get("start") && initial.get("finish")) {
    $("start").value = initial.get("start"); $("finish").value = initial.get("finish");
    if (initial.get("start_fuel_percent")) { fuel.value = initial.get("start_fuel_percent"); $("fuel-value").textContent = fuel.value + "%"; }
    if (initial.get("reserve_miles")) $("reserve_miles").value = initial.get("reserve_miles");
    if (initial.get("route_preference")) $("route_preference").value = initial.get("route_preference");
    plan();
  }
})();
</script>
</body>
</html>
