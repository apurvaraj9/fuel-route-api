name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Django checks
        env:
          DJANGO_DEBUG: "True"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - name: Tests
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py test --verbosity 2

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fuel-route-api .
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 -e DJANGO_SECRET_KEY=ci-only-secret -e DJANGO_ALLOWED_HOSTS=localhost fuel-route-api
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health/ && break; sleep 2; done
          curl -fsS http://localhost:8000/api/health/ | grep '"stations":6626'
          curl -fsS http://localhost:8000/ | grep -q "Fuel Route Planner"
          curl -fsS http://localhost:8000/api/docs/ | grep -qi "swagger"
          curl -fsS -o /dev/null http://localhost:8000/admin/login/
      - name: Container logs
        if: always()
        run: docker logs app
